apiVersion: 1

datasources:
  - name: Zabbix
    uid: zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: $ZABBIX_URL
    isDefault: true
    jsonData:
      authType: userLogin
      username: $ZABBIX_USER
      trends: true
    secureJsonData:
      password: $ZABBIX_PASSWORD
